<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer ></script>
</head>
<body>
    <div class="wrapper">
        <h1>Calculator</h1>
        <div class="container">
            <div class="display"> <input type="text" value="0" readonly></div>
            <div class="row">
                 <button>7</button> 
                 <button>8</button> 
                 <button>9</button> 
                 <button class="op">/</button> 
            </div>
            <div class="row">
                 <button>4</button> 
                 <button>5</button> 
                 <button>6</button> 
                 <button class="op">*</button> 
            </div>
            <div class="row">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="op">-</button>
            </div>
            <div class="row">
                <button>0</button>
                <button>.</button>
                <button>C</button>
                <button class="op">+</button>
            </div>
            <div class="row">
                <button class="equal">=</button>
                <button class="backspace">⌫</button>
            </div>
        </div>
    </div>
</body>
</html>
